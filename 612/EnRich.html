<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>安泰菁英人才訓練計畫</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    cursor: pointer;
}

#hint {
    position: fixed;
    bottom: 20px;
    right: 20px;
    color: white;
    font-family: Arial, sans-serif;
    background: rgba(0,0,0,0.5);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0.8;
}
</style>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    loop
    playsinline
>
    <source src="612.mp4" type="video/mp4">
    您的瀏覽器不支援影片播放。
</video>

<div id="hint">
    點擊畫面開啟／關閉聲音
</div>

<script>
const video = document.getElementById('video');
const hint = document.getElementById('hint');

video.addEventListener('click', () => {
    video.muted = !video.muted;

    if(video.muted){
        hint.textContent = "已靜音";
    }else{
        hint.textContent = "已開啟聲音";
    }

    setTimeout(() => {
        hint.style.opacity = "0";
    }, 1500);
});
</script>

</body>
</html>
