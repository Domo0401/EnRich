<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>安泰菁英人才訓練計畫</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#video {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 100vh;
    transform: translate(-50%, -50%);
    object-fit: contain;
    background: #000;
    cursor: pointer;
}

#hint {
    position: fixed;
    bottom: 20px;
    right: 20px;
    color: white;
    font-family: Arial;
    background: rgba(0,0,0,0.6);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0.8;
    transition: opacity 0.3s;
    z-index: 100;
}

/* ⚠️ 關鍵：預設是隱藏 */
#rotateMessage {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    color: white;

    justify-content: center;
    align-items: center;
    text-align: center;

    font-size: 22px;
    font-family: Arial;
    z-index: 9999;
}

/* 只在直式顯示 */
@media screen and (orientation: portrait) {
    #rotateMessage {
        display: flex;
    }
}
</style>
</head>

<body>

<!-- 旋轉提示 -->
<div id="rotateMessage">
    📱 請將手機旋轉為橫向觀看
</div>

<!-- 影片 -->
<video
    id="video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
>
    <source src="612.mp4" type="video/mp4">
    您的瀏覽器不支援影片播放。
</video>

<!-- 操作提示 -->
<div id="hint">
    點擊畫面開啟／關閉聲音
</div>

<script>
const video = document.getElementById('video');
const hint = document.getElementById('hint');

/* 確保能播放（手機強制策略） */
function tryPlay() {
    video.play().catch(() => {});
}

/* 點擊切換靜音 */
video.addEventListener('click', () => {
    video.muted = !video.muted;

    hint.textContent = video.muted ? "🔇 已靜音" : "🔊 已開啟聲音";

    hint.style.opacity = "1";
    setTimeout(() => {
        hint.style.opacity = "0";
    }, 1500);
});

/* 旋轉 / 窗口變化時保持播放（關鍵修正） */
function handleResume() {
    setTimeout(() => {
        tryPlay();
    }, 300);
}

window.addEventListener('orientationchange', handleResume);
window.addEventListener('resize', handleResume);
document.addEventListener('visibilitychange', () => {
    if (!document.hidden) handleResume();
});

/* 首次載入播放 */
window.addEventListener('load', () => {
    tryPlay();
});
</script>

</body>
</html>
